<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workday application fixture</title>
  <style>
    [role=listbox] { border: 1px solid #ccc; background: #fff; list-style: none; padding: 0; }
    [role=option] { padding: 4px 8px; cursor: pointer; }
    .row { margin: 8px 0; }
    input[type=checkbox].wd-check, input[type=radio].wd-radio { width: 16px; height: 16px; }
  </style>
</head>
<body>
<!-- Mirrors Workday's candidate application (data-automation-id conventions),
     including its in-place step changes. -->
<div data-automation-id="applyFlowPage">
  <h2 data-automation-id="pageHeaderTitle" id="step-title">My Information</h2>
  <div id="step"></div>
  <button type="button" data-automation-id="pageFooterNextButton" id="next">Save and Continue</button>
</div>

<template id="step-1">
  <div data-automation-id="formField-sourcePrompt" class="row">
    <label for="input-1">How Did You Hear About Us?<abbr title="required">*</abbr></label>
    <div data-automation-id="multiselectInputContainer">
      <input id="input-1" data-automation-id="searchBox" placeholder="Search" aria-required="true" type="text">
      <div data-automation-id="selectedItemList"></div>
    </div>
  </div>
  <fieldset data-automation-id="formField-candidateIsPreviousWorker" class="row">
    <legend><label>Have you previously worked for Acme?<abbr>*</abbr></label></legend>
    <input class="wd-radio" type="radio" id="prev-yes" name="candidateIsPreviousWorker" value="true"><label for="prev-yes">Yes</label>
    <input class="wd-radio" type="radio" id="prev-no" name="candidateIsPreviousWorker" value="false"><label for="prev-no">No</label>
  </fieldset>
  <div data-automation-id="formField-countryDropdown" class="row">
    <label for="input-3">Country<abbr>*</abbr></label>
    <button type="button" id="input-3" aria-haspopup="listbox" data-automation-id="countryDropdown" data-options="Canada|United Kingdom|United States of America" aria-label="Country Select One Required">Select One</button>
  </div>
  <div data-automation-id="formField-legalNameSection_firstName" class="row">
    <label for="input-4">Given Name(s)<abbr>*</abbr></label>
    <input type="text" id="input-4" data-automation-id="legalNameSection_firstName" aria-required="true">
  </div>
  <div data-automation-id="formField-legalNameSection_lastName" class="row">
    <label for="input-5">Family Name<abbr>*</abbr></label>
    <input type="text" id="input-5" data-automation-id="legalNameSection_lastName" aria-required="true">
  </div>
  <div data-automation-id="formField-addressSection_addressLine1" class="row">
    <label for="input-6">Address Line 1</label>
    <input type="text" id="input-6" data-automation-id="addressSection_addressLine1">
  </div>
  <div data-automation-id="formField-addressSection_city" class="row">
    <label for="input-7">City</label>
    <input type="text" id="input-7" data-automation-id="addressSection_city">
  </div>
  <div data-automation-id="formField-addressSection_countryRegion" class="row">
    <label for="input-8">State</label>
    <button type="button" id="input-8" aria-haspopup="listbox" data-automation-id="addressSection_countryRegion" data-options="Arizona|California|Colorado">Select One</button>
  </div>
  <div data-automation-id="formField-addressSection_postalCode" class="row">
    <label for="input-9">Postal Code</label>
    <input type="text" id="input-9" data-automation-id="addressSection_postalCode">
  </div>
  <div data-automation-id="formField-email" class="row">
    <label for="input-10">Email Address</label>
    <input type="text" id="input-10" data-automation-id="email">
  </div>
  <div data-automation-id="formField-phone-device-type" class="row">
    <label for="input-11">Phone Device Type<abbr>*</abbr></label>
    <button type="button" id="input-11" aria-haspopup="listbox" data-automation-id="phone-device-type" data-options="Landline|Mobile">Select One</button>
  </div>
  <div data-automation-id="formField-phone-number" class="row">
    <label for="input-12">Phone Number<abbr>*</abbr></label>
    <input type="text" id="input-12" data-automation-id="phone-number" aria-required="true">
  </div>
</template>

<template id="step-2">
  <div data-automation-id="workExperienceSection">
    <h3>Work Experience</h3>
    <div data-automation-id="workExperience-1" role="group" aria-labelledby="we-1">
      <h4 id="we-1">Work Experience 1</h4>
      <div class="row"><label for="input-20">Job Title<abbr>*</abbr></label><input type="text" id="input-20" data-automation-id="jobTitle"></div>
      <div class="row"><label for="input-21">Company<abbr>*</abbr></label><input type="text" id="input-21" data-automation-id="company"></div>
      <div class="row"><label for="input-22">Location</label><input type="text" id="input-22" data-automation-id="location"></div>
      <div class="row"><input class="wd-check" type="checkbox" id="input-23" data-automation-id="currentlyWorkHere"><label for="input-23">I currently work here</label></div>
      <div data-automation-id="formField-startDate" class="row">
        <label id="start-1-label">From<abbr>*</abbr></label>
        <div data-automation-id="dateInputWrapper">
          <div data-automation-id="dateSectionMonth"><input type="text" role="spinbutton" aria-label="Month" data-automation-id="dateSectionMonth-input" placeholder="MM"></div>
          <div data-automation-id="dateSectionYear"><input type="text" role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" placeholder="YYYY"></div>
        </div>
      </div>
      <div class="row"><label for="input-24">Role Description</label><textarea id="input-24" data-automation-id="description"></textarea></div>
    </div>
    <div data-automation-id="workExperience-2" role="group" aria-labelledby="we-2">
      <h4 id="we-2">Work Experience 2</h4>
      <div class="row"><label for="input-30">Job Title<abbr>*</abbr></label><input type="text" id="input-30" data-automation-id="jobTitle"></div>
      <div class="row"><label for="input-31">Company<abbr>*</abbr></label><input type="text" id="input-31" data-automation-id="company"></div>
      <div data-automation-id="formField-startDate" class="row">
        <label>From<abbr>*</abbr></label>
        <div data-automation-id="dateInputWrapper">
          <div data-automation-id="dateSectionMonth"><input type="text" role="spinbutton" aria-label="Month" data-automation-id="dateSectionMonth-input" placeholder="MM"></div>
          <div data-automation-id="dateSectionYear"><input type="text" role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" placeholder="YYYY"></div>
        </div>
      </div>
      <div data-automation-id="formField-endDate" class="row">
        <label>To<abbr>*</abbr></label>
        <div data-automation-id="dateInputWrapper">
          <div data-automation-id="dateSectionMonth"><input type="text" role="spinbutton" aria-label="Month" data-automation-id="dateSectionMonth-input" placeholder="MM"></div>
          <div data-automation-id="dateSectionYear"><input type="text" role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" placeholder="YYYY"></div>
        </div>
      </div>
    </div>
  </div>
  <div data-automation-id="educationSection">
    <h3>Education</h3>
    <div data-automation-id="education-1" role="group">
      <div class="row"><label for="input-40">School or University<abbr>*</abbr></label><input type="text" id="input-40" data-automation-id="school"></div>
      <div class="row"><label for="input-41">Degree<abbr>*</abbr></label><button type="button" id="input-41" aria-haspopup="listbox" data-automation-id="degree" data-options="Associate's Degree|Bachelor's Degree|Master's Degree|Doctorate">Select One</button></div>
      <div class="row"><label for="input-42">Field of Study</label><input type="text" id="input-42" data-automation-id="fieldOfStudy"></div>
      <div class="row"><label for="input-43">Overall Result (GPA)</label><input type="text" id="input-43" data-automation-id="gpa"></div>
    </div>
  </div>
  <div data-automation-id="resumeSection" class="row">
    <h3>Resume/CV</h3>
    <div data-automation-id="file-upload-drop-zone"><input type="file" data-automation-id="file-upload-input-ref"></div>
  </div>
  <div data-automation-id="websiteSection" class="row">
    <h3>Websites</h3>
    <label for="input-50">LinkedIn</label><input type="text" id="input-50" data-automation-id="linkedinQuestion">
  </div>
</template>

<script>
  const SOURCES = ['Job Board', 'LinkedIn', 'Employee Referral', 'Company Website'];
  function wire(root) {
    // Listbox buttons.
    for (const btn of root.querySelectorAll('button[aria-haspopup=listbox]')) {
      btn.addEventListener('click', () => {
        document.querySelectorAll('ul[role=listbox]').forEach((l) => l.remove());
        const ul = document.createElement('ul');
        ul.setAttribute('role', 'listbox');
        for (const o of btn.dataset.options.split('|')) {
          const li = document.createElement('li');
          li.setAttribute('role', 'option');
          li.innerHTML = '<div>' + o + '</div>';
          li.addEventListener('click', () => { btn.textContent = o; btn.dataset.value = o; ul.remove(); });
          ul.append(li);
        }
        btn.after(ul);
        btn.setAttribute('aria-expanded', 'true');
      });
    }
    // Search prompt: results only after Enter.
    for (const box of root.querySelectorAll('[data-automation-id=searchBox]')) {
      box.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        box.parentElement.querySelectorAll('[data-automation-id=promptOption]').forEach((x) => x.remove());
        for (const s of SOURCES.filter((s) => s.toLowerCase().includes(box.value.toLowerCase()))) {
          const d = document.createElement('div');
          d.setAttribute('data-automation-id', 'promptOption');
          d.setAttribute('role', 'option');
          d.textContent = s;
          d.addEventListener('click', () => {
            box.parentElement.querySelector('[data-automation-id=selectedItemList]').textContent = s;
            box.value = '';
            box.parentElement.querySelectorAll('[data-automation-id=promptOption]').forEach((x) => x.remove());
          });
          box.after(d);
        }
      });
    }
  }
  let step = 1;
  function show(n) {
    const stepEl = document.getElementById('step');
    stepEl.replaceChildren(document.getElementById('step-' + n).content.cloneNode(true));
    document.getElementById('step-title').textContent = n === 1 ? 'My Information' : 'My Experience';
    wire(stepEl);
  }
  document.getElementById('next').addEventListener('click', () => { if (step < 2) show(++step); });
  show(1);
</script>
</body>
</html>
