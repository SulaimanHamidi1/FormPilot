<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Greenhouse (job-boards) application fixture</title>
  <style>
    .iti__hide { display: none; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .select-shell input[tabindex="-1"] { opacity: 0; height: 0; width: 0; position: absolute; display: none; }
  </style>
</head>
<body>
<!-- Structure mirrors job-boards.greenhouse.io (remix UI) as of 2026-10. -->
<form id="application-form" class="application--form">
  <div class="application--questions">
    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="first_name-label" for="first_name" class="label">First Name<span>*</span></label>
      <input id="first_name" class="input input__single-line" aria-label="First Name" aria-required="true" type="text" autocomplete="given-name">
    </div></div></div>
    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="last_name-label" for="last_name" class="label">Last Name<span>*</span></label>
      <input id="last_name" class="input input__single-line" aria-label="Last Name" aria-required="true" type="text" autocomplete="family-name">
    </div></div></div>
    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="email-label" for="email" class="label">Email<span>*</span></label>
      <input id="email" class="input input__single-line" aria-label="Email" aria-required="true" type="text" autocomplete="email">
    </div></div></div>

    <div class="select">
      <div class="select__container">
        <label id="country-label" for="country" class="label select__label">Country</label>
        <div class="select-shell">
          <div class="select__control">
            <div class="select__value-container">
              <div class="select__placeholder" id="react-select-country-placeholder">Select...</div>
              <div class="select__input-container"><input id="country" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="country-label" autocomplete="off" type="text" value=""></div>
            </div>
          </div>
          <input tabindex="-1" aria-hidden="true" required type="text" value="">
        </div>
      </div>
    </div>

    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="phone-label" for="phone" class="label">Phone</label>
      <div class="iti iti--allow-dropdown">
        <div class="iti__country-container">
          <button type="button" class="iti__selected-country" aria-haspopup="listbox" aria-controls="iti-0__country-listbox" aria-expanded="false" aria-label="Select country"></button>
          <div class="iti__dropdown-content iti__hide">
            <input type="search" id="iti-0__search-input" class="iti__search-input" role="combobox" placeholder="Search" aria-label="Search">
            <ul id="iti-0__country-listbox" role="listbox" aria-label="List of countries">
              <li id="iti-0__item-ca" role="option" class="iti__country" aria-selected="false">Canada+1</li>
              <li id="iti-0__item-us" role="option" class="iti__country" aria-selected="false">United States+1</li>
            </ul>
          </div>
        </div>
        <input id="phone" class="input" aria-label="Phone" type="tel" autocomplete="off">
      </div>
    </div></div></div>

    <div class="file-upload" role="group" aria-labelledby="upload-label-resume">
      <div id="upload-label-resume" class="label upload-label">Resume/CV<span>*</span></div>
      <div class="button-container"><div class="secondary-button"><div>
        <label for="resume" class="button button--secondary">Attach</label>
        <input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
      </div></div></div>
    </div>
    <div class="file-upload" role="group" aria-labelledby="upload-label-cover_letter">
      <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
      <div class="button-container"><div class="secondary-button"><div>
        <label for="cover_letter" class="button button--secondary">Attach</label>
        <input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
      </div></div></div>
    </div>

    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="question_1-label" for="question_1" class="label">LinkedIn Profile</label>
      <input id="question_1" class="input" aria-label="LinkedIn Profile" type="text">
    </div></div></div>
    <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="question_2-label" for="question_2" class="label">What's the name you'd prefer us to use throughout the interview process?</label>
      <input id="question_2" class="input" aria-label="What's the name you'd prefer us to use throughout the interview process?" type="text">
    </div></div></div>

    <div class="select"><div class="select__container">
      <label id="question_3-label" for="question_3" class="label select__label">Please choose the country in which you are located.</label>
      <div class="select-shell"><div class="select__control"><div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <div class="select__input-container"><input id="question_3" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="question_3-label" autocomplete="off" type="text" value=""></div>
      </div></div></div>
    </div></div>
    <div class="select"><div class="select__container">
      <label id="question_4-label" for="question_4" class="label select__label">Will you now or in the future require sponsorship for a visa to remain in your current location?<span>*</span></label>
      <div class="select-shell"><div class="select__control"><div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <div class="select__input-container"><input id="question_4" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="question_4-label" aria-required="true" autocomplete="off" type="text" value=""></div>
      </div></div><input tabindex="-1" aria-hidden="true" required type="text" value=""></div>
    </div></div>
    <div class="select"><div class="select__container">
      <label id="question_5-label" for="question_5" class="label select__label">Have you previously worked at or consulted for Acme?<span>*</span></label>
      <div class="select-shell"><div class="select__control"><div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <div class="select__input-container"><input id="question_5" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="question_5-label" aria-required="true" autocomplete="off" type="text" value=""></div>
      </div></div><input tabindex="-1" aria-hidden="true" required type="text" value=""></div>
    </div></div>
    <div class="select"><div class="select__container">
      <label id="question_6-label" for="question_6" class="label select__label">Are you subject to any employment agreements and/or post-employment restrictions with your current employer?<span>*</span></label>
      <div class="select-shell"><div class="select__control"><div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <div class="select__input-container"><input id="question_6" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="question_6-label" aria-required="true" autocomplete="off" type="text" value=""></div>
      </div></div><input tabindex="-1" aria-hidden="true" required type="text" value=""></div>
    </div></div>
  </div>

  <div class="eeoc__container">
    <h3>Voluntary Self-Identification</h3>
    <div class="select"><div class="select__container">
      <label id="gender-label" for="gender" class="label select__label">Gender</label>
      <div class="select-shell"><div class="select__control"><div class="select__value-container">
        <div class="select__placeholder" id="react-select-gender-placeholder">Select...</div>
        <div class="select__input-container"><input id="gender" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="gender-label" autocomplete="off" type="text" value=""></div>
      </div></div></div>
    </div></div>
    <div class="select"><div class="select__container">
      <label id="hispanic_ethnicity-label" for="hispanic_ethnicity" class="label select__label">Are you Hispanic/Latino?</label>
      <div class="select-shell"><div class="select__control"><div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <div class="select__input-container"><input id="hispanic_ethnicity" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="hispanic_ethnicity-label" autocomplete="off" type="text" value=""></div>
      </div></div></div>
    </div></div>
    <div class="select"><div class="select__container">
      <label id="veteran_status-label" for="veteran_status" class="label select__label">Veteran Status</label>
      <div class="select-shell"><div class="select__control"><div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <div class="select__input-container"><input id="veteran_status" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="veteran_status-label" autocomplete="off" type="text" value=""></div>
      </div></div></div>
    </div></div>
    <div class="select"><div class="select__container">
      <label id="disability_status-label" for="disability_status" class="label select__label">Disability Status</label>
      <div class="select-shell"><div class="select__control"><div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <div class="select__input-container"><input id="disability_status" class="select__input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="disability_status-label" autocomplete="off" type="text" value=""></div>
      </div></div></div>
    </div></div>
  </div>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
