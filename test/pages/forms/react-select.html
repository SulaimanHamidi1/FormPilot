<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>react-select (Greenhouse-style) live test</title>
  <style>body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 24px auto; } .field { margin: 14px 0; } pre { background: #f3f3f3; padding: 8px; }</style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "react-select": "https://esm.sh/react-select@5.8.0?deps=react@18.3.1,react-dom@18.3.1"
      }
    }
  </script>
</head>
<body>
<h1>Real react-select, configured like Greenhouse's job board</h1>
<div id="root"></div>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import Select from 'react-select';
  const e = React.createElement;
  const Q = [
    { id: 'country', label: 'Country', options: ['Canada', 'Mexico', 'United Kingdom', 'United States'] },
    { id: 'question_4', label: 'Will you now or in the future require sponsorship for a visa?*', options: ['Yes', 'No'] },
    { id: 'question_5', label: 'Have you previously worked at or consulted for Acme?*', options: ['Yes', 'No'] },
    { id: 'gender', label: 'Gender', options: ['Male', 'Female', 'Decline To Self Identify'] },
    { id: 'veteran_status', label: 'Veteran Status', options: ['I am not a protected veteran', 'I identify as one or more of the classifications of protected veteran', "I don't wish to answer"] },
  ];
  function App() {
    const [s, set] = React.useState({});
    return e('form', { onSubmit: (ev) => { ev.preventDefault(); window.__submitted = true; } },
      Q.map((q) => e('div', { className: 'field', key: q.id },
        e('label', { id: q.id + '-label', htmlFor: q.id }, q.label),
        e(Select, {
          inputId: q.id, classNamePrefix: 'select', 'aria-labelledby': q.id + '-label',
          options: q.options.map((o) => ({ value: o, label: o })),
          onChange: (o) => set((p) => ({ ...p, [q.id]: o && o.value })),
        }))),
      e('pre', { id: 'state' }, JSON.stringify(s, null, 1)));
  }
  createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
