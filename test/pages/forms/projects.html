<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Experience and projects</title></head>

  <section>

    <div><label for="p1-desc">Description</label><textarea id="p1-desc"></textarea></div>
  </section>
  <div data-automation-id="projectSection">
    <div data-automation-id="project-2" role="group">
      <label for="p2-name">Project Name</label><input id="p2-name">
      <label for="p2-company">Company</label><input id="p2-company">
    </div>
  </div>
</form>
</body>
</html>
