<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FormPilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../../icons/icon32.png" alt="" width="20" height="20">
    <h1>FormPilot</h1>
  </header>
  <p id="profile-status" class="muted">Loading profile…</p>
  <button id="fill" class="primary">Fill this page</button>
  <p id="result" class="result" hidden></p>
  <p class="muted small">Shortcut: <kbd id="shortcut">Alt+Shift+J</kbd></p>
  <p id="launcher-tip" class="muted small" hidden>Tip: <a href="#" id="launcher-link">show the FormPilot button on application pages</a></p>
  <footer>
    <a href="#" id="open-options">Edit profile &amp; settings</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
